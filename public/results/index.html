<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop Results · TrustMyChef</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/results.css">
</head>
<body class="rs">
<header class="rs-top">
  <a class="brand" href="/" style="text-decoration:none"><span class="brand-mark"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><path d="M6 17h12"/></svg></span><span data-t="title">Workshop results</span></a>
  <div class="rs-actions">
    <span class="rs-live" id="live" aria-live="polite"></span>
    <button class="btn btn-line btn-sm" id="lang">한국어</button>
    <button class="btn btn-line btn-sm" id="refresh" data-t="refresh">Refresh</button>
    <button class="btn btn-line btn-sm" id="csv1" data-t="csvResp">CSV · answers</button>
    <button class="btn btn-line btn-sm danger" id="wipe" data-t="wipe">Delete all</button>
  </div>
</header>

<main class="rs-main">
  <section id="gate" class="rs-gate" hidden>
    <h1 class="h-title" data-t="gateTitle">Enter the results key</h1>
    <p class="t-sub" data-t="gateBody">Only the team can see the answers.</p>
    <form id="gate-form"><input class="input" id="key" type="password" autocomplete="off" aria-label="Results key"><button class="btn btn-primary" data-t="open">Open</button></form>
    <p class="err" id="gate-err" hidden></p>
  </section>

  <section id="dash" hidden>
    <div class="rs-filters" id="filters"></div>
    <div class="kpis" id="kpis"></div>
    <div class="rs-grid">
      <article class="rs-card span2">
        <div class="rs-card-head"><h2 data-t="chartA">Screens · How convenient × Would pay</h2>
          <label class="rs-toggle"><input type="checkbox" id="dotsA" checked> <span data-t="showDots">Show every answer</span></label></div>
        <div class="rs-chart-wrap"><div id="chartA" class="rs-chart"></div><div id="tableA" class="rs-table-wrap"></div></div>
      </article>
      <article class="rs-card"><h2 data-t="behavior">What people did in the prototype</h2><div id="behavior"></div></article>
      <article class="rs-card span2"><h2 data-t="list">Every answer (time recorded)</h2><div id="list" class="rs-table-wrap"></div></article>
      <article class="rs-card"><h2 data-t="profile">Who answered</h2><div id="profile"></div></article>
    </div>
  </section>
</main>
<script type="module" src="/js/results.js"></script>
</body>
</html>
